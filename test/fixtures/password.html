<!doctype html>
<html><head><meta charset="utf-8"><title>Sign in</title></head>
<body>
  <form action="/submit" method="post">
    <label for="u">Username</label> <input id="u" name="u" autocomplete="username">
    <label for="p">Password</label> <input id="p" name="p" type="password" value="hunter2" autocomplete="current-password">
    <label for="otp">One-time code</label> <input id="otp" name="otp" autocomplete="one-time-code" value="123456">
    <label for="card">Card number</label> <input id="card" name="card" value="4111111111111111">
    <button type="submit">Sign in</button>
  </form>
</body></html>
