<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude activity</title>
  <link rel="stylesheet" href="../ui/ui.css">
  <style>
    body { padding: 24px 16px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    header h1 { flex: 1; font-size: 18px; }
    .wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
    table { border-collapse: collapse; width: 100%; font-size: 12px; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; }
    td.url { max-width: 280px; word-break: break-all; color: var(--muted); }
    td.time { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ok { color: var(--ok); }
    .bad { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>Claude activity</h1>
    <span class="muted" id="count"></span>
    <button id="refresh">Refresh</button>
    <button id="clear" class="danger">Clear</button>
  </header>
  <p class="muted">The last 500 actions. Typed values are recorded only by length.</p>
  <div class="wrap">
    <table>
      <thead><tr><th>Time</th><th>Action</th><th>Target</th><th>Result</th><th>Approved</th><th>Detail</th><th>Page</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script src="activity.js"></script>
</body>
</html>
